<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KidCoins - Share Progress Progress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,700;0,6..12,900;1,6..12,700&display=swap"
        rel="stylesheet">

    <style>
        body {
            background-color: #f2f9f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Nunito Sans', sans-serif;
        }

        /* Kontainer Utama - Menggunakan Hero Color Asli Aplikasi Anda */
        #progress-card {
            width: 380px;
            height: 540px;
            background-color: rgb(46 125 50);
            /* #2e7d32 - Hijau Utama Anda */
            border-radius: 60px;
            padding: 30px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            /* Efek Shadow 3D Pop disesuaikan dengan tone warna hijau Anda */
            box-shadow: 0 20px 0px #1b4d1f, 0 30px 50px rgba(27, 77, 31, 0.35);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- DEKORASI GELEMBUNG PASTEL BIAR TETAP KIDS-FRIENDLY --- */
        .bubble-bg {
            position: absolute;
            border-radius: 50%;
            z-index: 1;
        }

        /* Perpaduan kuning mentega, pink soft, dan hijau muda agar background hijau tua Anda tetap hidup */
        .b-1 {
            width: 150px;
            height: 150px;
            background-color: #ffeaa7;
            top: -35px;
            right: -35px;
            opacity: 0.9;
        }

        .b-2 {
            width: 190px;
            height: 190px;
            background-color: #a1d2ff;
            bottom: -50px;
            left: -50px;
            opacity: 0.9;
        }

        .b-3 {
            width: 80px;
            height: 80px;
            background-color: #a3e6b9;
            top: 32%;
            left: -25px;
            opacity: 0.4;
        }

        /* Header Kartu */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        /* Badge Nama Aplikasi */
        .app-badge {
            background-color: #fffef9;
            color: rgb(46 125 50);
            /* Menggunakan warna utama */
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 900;
            font-size: 15px;
            box-shadow: 0 6px 0px #e6e4dc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Badge Kategori */
        .category-badge {
            background-color: #fff0b3;
            color: #8a6d00;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 900;
            font-size: 13px;
            text-transform: uppercase;
            box-shadow: 0 6px 0px #ebd68c;
        }

        /* Blok Konten Utama - Bubble Putih Bersih */
        .main-content-box {
            background-color: #fffef9;
            border-radius: 44px;
            padding: 30px 24px;
            margin-top: 20px;
            box-shadow: 0 12px 0px #ebe9df;
            z-index: 2;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .headline {
            font-size: 34px;
            font-weight: 900;
            line-height: 1.15;
            color: rgb(46 125 50);
            /* Judul mengikuti warna utama */
            margin: 0 0 14px 0;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .description {
            font-size: 15px;
            font-weight: 700;
            color: #4b5563;
            line-height: 1.6;
            margin: 0;
        }

        /* Kapsul Nama Anak - Dibuat Kontras Ceria */
        .child-name {
            color: #ff6b81;
            font-weight: 900;
            background-color: #ffe8ec;
            padding: 4px 14px;
            border-radius: 16px;
            display: inline-block;
            box-shadow: 0 3px 0px #ffccd5;
        }

        /* --- FOOTER LAYOUT --- */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            margin-top: 15px;
            z-index: 2;
            border-top: 4px dotted rgba(255, 255, 255, 0.4);
        }

        /* Kotak Tautan Link & Referral bergaya Bubble Transparan */
        .footer-link-container {
            background-color: rgba(255, 255, 255, 0.9);
            border: 2.5px solid rgba(255, 255, 255, 0.35);
            padding: 10px 22px;
            border-radius: 20px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            max-width: 75%;
            box-shadow: 0 4px 0px rgba(27, 77, 31, 0.2);
        }

        .link-label {
            font-size: 10px;
            font-weight: 900;
            color: rgb(46 125 50);
            /* Kuning cerah agar terbaca jelas di background hijau tua */
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .footer-center {
            text-decoration: none;
            color: rgb(46 125 50);
            font-size: 13px !important;
            font-weight: 900;
            word-break: break-all;
        }

        /* Ikon Piala */
        .footer-trophy {
            font-size: 46px;
            filter: drop-shadow(0px 5px 0px rgba(0, 0, 0, 0.1));
            animation: float-cute 3s infinite ease-in-out;
            margin-right: 5px;
        }

        @keyframes float-cute {

            0%,
            100__ {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-8px) scale(1.05) rotate(5deg);
            }
        }
    </style>
</head>

<body>

    <div id="progress-card">

        <div class="bubble-bg b-1"></div>
        <div class="bubble-bg b-2"></div>
        <div class="bubble-bg b-3"></div>

        <div class="card-header">
            <div class="app-badge">
                <span style="font-size: 18px;">✨</span> KidCoins
            </div>
            <div class="category-badge">🏆 SKILL UP</div>
        </div>

        <div class="main-content-box">
            <h1 class="headline">YAY! HEBAT MAKSIMAL</h1>
            <p class="description">
                Selamat untuk <span class="child-name">Azizah</span>! Baru saja membuka pencapaian baru dalam kategori
                <span style="color: rgb(46 125 50); font-weight: 800;">"Tidak Mudah Menyerah"</span> melalui aktivitas
                Story Telling.
            </p>
        </div>

        <div class="card-footer">
            <div class="footer-link-container">
                <span class="link-label">Yuk selesaikan misi lagi</span>
                <a href="https://kidcoins.com?reff=XAIST" class="footer-center"
                    target="_blank">kidcoins.com?code=XAIST</a>
            </div>

            <div class="footer-trophy">🏆</div>
        </div>
    </div>

</body>

</html>
